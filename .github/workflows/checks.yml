name: checks

# runs the scripts from the base branch; the pull request is only ever read as data, never executed
on:
  pull_request_target:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: check out the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: fetch the pull request as data
        run: |
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pull/head"
          mkdir -p "$RUNNER_TEMP/report" "$RUNNER_TEMP/pr"
          git archive "$HEAD_SHA" data | tar -x -C "$RUNNER_TEMP/pr"

      - name: verify maintainer authorization
        id: verify
        continue-on-error: true
        env:
          VERIFY_AUTH_REPORT: ${{ runner.temp }}/report/verify-auth.md
        run: python3 utils/verify_auth.py "$BASE_SHA" "$HEAD_SHA"

      - name: validate registry objects against their schemas
        id: validate
        continue-on-error: true
        run: python3 utils/validate.py --data "$RUNNER_TEMP/pr/data"

      - name: install named-checkzone
        run: sudo apt-get update -q && sudo apt-get install -yq bind9-utils

      - name: generate and check zones
        id: zones
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        run: |
          python3 "$GITHUB_WORKSPACE/utils/generate_zone.py" --check --data "$RUNNER_TEMP/pr/data"
          named-checkzone iw. iw.db
          named-checkzone 10.in-addr.arpa. rdns.db

      - name: comment the report on the pull request
        if: always()
        uses: actions/github-script@v9
        env:
          REPORT: ${{ runner.temp }}/report/verify-auth.md
          VERIFY: ${{ steps.verify.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          ZONES: ${{ steps.zones.outcome }}
        with:
          script: |
            const fs = require("fs");
            const { REPORT, VERIFY, VALIDATE, ZONES } = process.env;
            const issue_number = context.payload.pull_request.number;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = fs.existsSync(REPORT)
              ? fs.readFileSync(REPORT, "utf8")
              : "_verify-auth did not write a report._\n";

            const marker = "<!-- verify-auth-report -->";
            const body = [
              marker,
              "## Registry checks",
              "",
              "| check | result |",
              "| --- | --- |",
              `| verify-auth | ${VERIFY || "skipped"} |`,
              `| validate | ${VALIDATE || "skipped"} |`,
              `| zones | ${ZONES || "skipped"} |`,
              "",
              `Details are in the [run log](${run}).`,
              "",
              "### Verify auth report",
              "",
              report,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: fail if a check failed
        if: steps.verify.outcome != 'success' || steps.validate.outcome != 'success' || steps.zones.outcome != 'success'
        run: exit 1
