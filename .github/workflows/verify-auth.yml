name: verify-auth

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: verify maintainer authorization
        env:
          REPORT_DIR: ${{ runner.temp }}/verify-auth-report
          VERIFY_AUTH_REPORT: ${{ runner.temp }}/verify-auth-report/report.md
        run: |
          mkdir -p "$REPORT_DIR"
          echo "${{ github.event.pull_request.number }}" > "$REPORT_DIR/pr-number"
          python3 utils/verify_auth.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-auth-report
          path: ${{ runner.temp }}/verify-auth-report
          if-no-files-found: ignore
          retention-days: 7
