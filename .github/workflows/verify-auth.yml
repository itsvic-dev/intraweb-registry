name: verify-auth

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: verify maintainer authorization
        env:
          VERIFY_AUTH_REPORT: ${{ runner.temp }}/verify-auth-report.md
        run: >
          python3 utils/verify_auth.py
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

      - name: comment report on PR
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_AUTH_REPORT: ${{ runner.temp }}/verify-auth-report.md
        with:
          script: |
            const fs = require("fs");
            const path = process.env.VERIFY_AUTH_REPORT;
            if (!fs.existsSync(path)) {
              return;
            }
            const marker = "<!-- verify-auth-report -->";
            const body = `${marker}\n## Verify auth report\n\n${fs.readFileSync(path, "utf8")}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
